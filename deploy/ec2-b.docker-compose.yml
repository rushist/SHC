# ==============================================================================
# EC2-B MANIFEST (Failure Domain 2): Nodes B, E, and H
# Target Host: EC2-B (e.g. Private IP: 10.0.1.11)
# ==============================================================================

services:
  # Node B (Primary for B keys, Replicated to Node C on EC2-C; Holds Replica of Node A from EC2-A)
  node-b:
    image: ${DOCKER_REGISTRY:-shc}/backend:latest
    container_name: shc-node-b
    restart: unless-stopped
    command: ["/app/cachenode"]
    environment:
      - NODE_ID=node-b
      - HOST_ID=EC2-B
      - NODE_ADDRESS=0.0.0.0
      - NODE_PORT=8001
      - PEER_NODES=${PEER_NODES:-node-a=http://10.0.1.10:8001,node-b=http://10.0.1.11:8001,node-c=http://10.0.1.13:8001,node-d=http://10.0.1.10:8002,node-e=http://10.0.1.11:8002,node-f=http://10.0.1.13:8002,node-g=http://10.0.1.10:8003,node-h=http://10.0.1.11:8003,node-i=http://10.0.1.13:8003}
      - CLEANUP_INTERVAL=1s
      - HEARTBEAT_INTERVAL=500ms
      - SUSPECT_TIMEOUT=1s
      - FAIL_TIMEOUT=2s
    ports:
      - "8001:8001"
    network_mode: host

  # Node E (Primary for E keys, Replicated to Node F on EC2-C; Holds Replica of Node D from EC2-A)
  node-e:
    image: ${DOCKER_REGISTRY:-shc}/backend:latest
    container_name: shc-node-e
    restart: unless-stopped
    command: ["/app/cachenode"]
    environment:
      - NODE_ID=node-e
      - HOST_ID=EC2-B
      - NODE_ADDRESS=0.0.0.0
      - NODE_PORT=8002
      - PEER_NODES=${PEER_NODES:-node-a=http://10.0.1.10:8001,node-b=http://10.0.1.11:8001,node-c=http://10.0.1.13:8001,node-d=http://10.0.1.10:8002,node-e=http://10.0.1.11:8002,node-f=http://10.0.1.13:8002,node-g=http://10.0.1.10:8003,node-h=http://10.0.1.11:8003,node-i=http://10.0.1.13:8003}
      - CLEANUP_INTERVAL=1s
      - HEARTBEAT_INTERVAL=500ms
      - SUSPECT_TIMEOUT=1s
      - FAIL_TIMEOUT=2s
    ports:
      - "8002:8002"
    network_mode: host

  # Node H (Primary for H keys, Replicated to Node I on EC2-C; Holds Replica of Node G from EC2-A)
  node-h:
    image: ${DOCKER_REGISTRY:-shc}/backend:latest
    container_name: shc-node-h
    restart: unless-stopped
    command: ["/app/cachenode"]
    environment:
      - NODE_ID=node-h
      - HOST_ID=EC2-B
      - NODE_ADDRESS=0.0.0.0
      - NODE_PORT=8003
      - PEER_NODES=${PEER_NODES:-node-a=http://10.0.1.10:8001,node-b=http://10.0.1.11:8001,node-c=http://10.0.1.13:8001,node-d=http://10.0.1.10:8002,node-e=http://10.0.1.11:8002,node-f=http://10.0.1.13:8002,node-g=http://10.0.1.10:8003,node-h=http://10.0.1.11:8003,node-i=http://10.0.1.13:8003}
      - CLEANUP_INTERVAL=1s
      - HEARTBEAT_INTERVAL=500ms
      - SUSPECT_TIMEOUT=1s
      - FAIL_TIMEOUT=2s
    ports:
      - "8003:8003"
    network_mode: host
