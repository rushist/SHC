# ==============================================================================
# GATEWAY & DASHBOARD MANIFEST (Public Ingress Tier)
# Target Host: Public EC2 / Web Ingress Tier
# ==============================================================================

services:
  # Gateway Router (Port :8000)
  gateway-router:
    image: ${DOCKER_REGISTRY:-shc}/backend:latest
    container_name: shc-gateway-router
    restart: unless-stopped
    command: ["/app/router"]
    environment:
      - ROUTER_PORT=8000
      - ROUTER_HOST=0.0.0.0
      - CACHE_NODES=${ALL_CACHE_NODES:-http://10.0.1.10:8001,http://10.0.1.10:8002,http://10.0.1.10:8003,http://10.0.1.11:8001,http://10.0.1.11:8002,http://10.0.1.11:8003,http://10.0.1.12:8001,http://10.0.1.12:8002,http://10.0.1.12:8003}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-shc_db}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_SSLMODE=${DATABASE_SSLMODE:-require}
      - HEARTBEAT_INTERVAL=500ms
      - SUSPECT_TIMEOUT=1s
      - FAIL_TIMEOUT=2s
      - REQUEST_TIMEOUT=2s
    ports:
      - "8000:8000"

  # Next.js Presentation Dashboard (Port :3000)
  dashboard:
    image: ${DOCKER_REGISTRY:-shc}/dashboard:latest
    container_name: shc-dashboard
    restart: unless-stopped
    environment:
      - PORT=3000
      - ROUTER_URL=http://gateway-router:8000
      - NEXT_PUBLIC_ROUTER_URL=${NEXT_PUBLIC_ROUTER_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - gateway-router
