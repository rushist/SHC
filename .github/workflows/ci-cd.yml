name: SHC Multi-Machine CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # STAGE 1: Build & Publish Container Images to GHCR
  # =========================================================================
  build-and-publish:
    name: "🔍 Phase 1: Build & Publish Images"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1.1 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ 1.2 Setup Go 1.22 Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: 🔨 1.3 Validate Go Backend Compilation
        run: |
          echo "========================================================"
          echo "🚀 Validating Go Backend Compilation"
          echo "========================================================"
          cd backend
          go mod tidy
          go build -v ./cmd/router
          go build -v ./cmd/node
          echo "✅ Backend compiled cleanly"

      - name: 🐳 1.4 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 1.5 Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 1.6 Build & Push Docker Images to GHCR
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Building and pushing container images to ghcr.io/${REPO_LOWER}..."
          
          docker build -t "ghcr.io/${REPO_LOWER}/backend:latest" ./backend
          docker build -t "ghcr.io/${REPO_LOWER}/dashboard:latest" ./dashboard
          
          docker push "ghcr.io/${REPO_LOWER}/backend:latest"
          docker push "ghcr.io/${REPO_LOWER}/dashboard:latest"
          echo "✅ Images published to GHCR successfully!"

      - name: 📊 1.7 CI Build Summary
        if: always()
        run: |
          echo "### 🔍 Phase 1 Build & Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Registry Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`ghcr.io/${{ github.repository }}/backend:latest\` | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | \`ghcr.io/${{ github.repository }}/dashboard:latest\` | ✅ Published |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2: Deploy to AWS Multi-Node Cluster (EC2-A, EC2-B, EC2-C)
  # =========================================================================
  deploy:
    name: "🚀 Phase 2: Deploy to AWS Cluster"
    needs: build-and-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 2.0 Setup SSH Key & Configuration
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ConnectTimeout 15
          EOF
          chmod 600 ~/.ssh/config

      # -----------------------------------------------------------------------
      # 2.1 Deploy to EC2-A (Public Gateway + Storage Nodes A, D, G)
      # -----------------------------------------------------------------------
      - name: 📡 2.1 Deploy to EC2-A (Gateway Router + Dashboard + Nodes A, D, G)
        run: |
          echo "Connecting to EC2-A (${{ secrets.EC2_A_HOST }})..."
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_A_HOST }} 'bash -s' << 'EOF'
            set -e
            echo "========================================================"
            echo "⚡ [EC2-A: 10.0.1.10] Syncing & Rolling Out Containers"
            echo "========================================================"
            export GIT_TERMINAL_PROMPT=0

            TARGET_DIR=""
            for d in /app/shc "$HOME/shc" /home/ubuntu/shc /home/ec2-user/shc; do
              if [ -d "$d" ]; then
                TARGET_DIR="$d"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/shc"
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"

            if [ ! -d .git ]; then
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" . || git clone "https://github.com/${{ github.repository }}.git" . || true
            else
              git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
              git fetch origin main || true
              git reset --hard origin/main || git pull origin main || true
            fi

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            DOCKER_CMD="docker compose"
            if docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker-compose"
            elif sudo docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker compose"
            elif sudo docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker-compose"
            fi

            $DOCKER_CMD -f deploy/ec2-a.docker-compose.yml pull || true
            $DOCKER_CMD -f deploy/ec2-a.docker-compose.yml up -d --remove-orphans --force-recreate
            echo "✅ [EC2-A] Gateway Router (:8000), Dashboard (:3000), and Nodes A, D, G are LIVE!"
          EOF

      # -----------------------------------------------------------------------
      # 2.2 Deploy to EC2-B (Private Node: 10.0.1.11 via Bastion)
      # -----------------------------------------------------------------------
      - name: 🔄 2.2 Deploy to EC2-B (Nodes B, E, H via Bastion)
        run: |
          echo "Connecting to EC2-B (10.0.1.11 via Bastion ${{ secrets.EC2_A_HOST }})..."
          ssh -i ~/.ssh/id_rsa -J ${{ secrets.EC2_USER }}@${{ secrets.EC2_A_HOST }} ${{ secrets.EC2_USER }}@10.0.1.11 'bash -s' << 'EOF'
            set -e
            echo "========================================================"
            echo "⚡ [EC2-B: 10.0.1.11] Updating Storage Nodes B, E, H"
            echo "========================================================"
            export GIT_TERMINAL_PROMPT=0

            TARGET_DIR=""
            for d in /app/shc "$HOME/shc" /home/ubuntu/shc /home/ec2-user/shc; do
              if [ -d "$d" ]; then
                TARGET_DIR="$d"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/shc"
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"

            if [ ! -d .git ]; then
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" . || git clone "https://github.com/${{ github.repository }}.git" . || true
            else
              git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
              git fetch origin main || true
              git reset --hard origin/main || git pull origin main || true
            fi

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            DOCKER_CMD="docker compose"
            if docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker-compose"
            elif sudo docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker compose"
            elif sudo docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker-compose"
            fi

            $DOCKER_CMD -f deploy/ec2-b.docker-compose.yml pull || true
            $DOCKER_CMD -f deploy/ec2-b.docker-compose.yml up -d --remove-orphans --force-recreate
            echo "✅ [EC2-B] Storage Nodes B, E, H are LIVE!"
          EOF

      # -----------------------------------------------------------------------
      # 2.3 Deploy to EC2-C (Private Node: 10.0.1.13 via Bastion)
      # -----------------------------------------------------------------------
      - name: 🔄 2.3 Deploy to EC2-C (Nodes C, F, I via Bastion)
        run: |
          echo "Connecting to EC2-C (10.0.1.13 via Bastion ${{ secrets.EC2_A_HOST }})..."
          ssh -i ~/.ssh/id_rsa -J ${{ secrets.EC2_USER }}@${{ secrets.EC2_A_HOST }} ${{ secrets.EC2_USER }}@10.0.1.13 'bash -s' << 'EOF'
            set -e
            echo "========================================================"
            echo "⚡ [EC2-C: 10.0.1.13] Updating Storage Nodes C, F, I"
            echo "========================================================"
            export GIT_TERMINAL_PROMPT=0

            TARGET_DIR=""
            for d in /app/shc "$HOME/shc" /home/ubuntu/shc /home/ec2-user/shc; do
              if [ -d "$d" ]; then
                TARGET_DIR="$d"
                break
              fi
            done
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/shc"
              mkdir -p "$TARGET_DIR"
            fi
            cd "$TARGET_DIR"

            if [ ! -d .git ]; then
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" . || git clone "https://github.com/${{ github.repository }}.git" . || true
            else
              git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
              git fetch origin main || true
              git reset --hard origin/main || git pull origin main || true
            fi

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            DOCKER_CMD="docker compose"
            if docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker compose"
            elif docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="docker-compose"
            elif sudo docker compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker compose"
            elif sudo docker-compose version >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker-compose"
            fi

            $DOCKER_CMD -f deploy/ec2-c.docker-compose.yml pull || true
            $DOCKER_CMD -f deploy/ec2-c.docker-compose.yml up -d --remove-orphans --force-recreate
            echo "✅ [EC2-C] Storage Nodes C, F, I are LIVE!"
          EOF

      # -----------------------------------------------------------------------
      # 2.4 Publish Rollout Summary
      # -----------------------------------------------------------------------
      - name: 🌐 2.4 Publish Deployment Summary
        if: always()
        run: |
          echo "## 🚀 AWS Multi-Machine Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Machine | Private IP | Failure Domain | Roles & Ports | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-A** | \`10.0.1.10\` | \`ap-south-1a\` | Gateway (:8000), Dashboard (:3000), Nodes A, D, G | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-B** | \`10.0.1.11\` | \`ap-south-1a\` | Nodes B, E, H (:8001-:8003) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-C** | \`10.0.1.13\` | \`ap-south-1b\` | Nodes C, F, I (:8001-:8003) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live Dashboard**: [http://${{ secrets.EC2_A_HOST }}:3000](http://${{ secrets.EC2_A_HOST }}:3000)" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Gateway API**: [http://${{ secrets.EC2_A_HOST }}:8000](http://${{ secrets.EC2_A_HOST }}:8000)" >> $GITHUB_STEP_SUMMARY