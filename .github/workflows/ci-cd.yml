name: SHC Multi-Machine CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub UI

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # STAGE 1: Continuous Integration (High-Speed Cloud Build & GHCR Publish)
  # =========================================================================
  ci:
    name: "🔍 Phase 1: Build & Publish Images"
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1.1 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ 1.2 Setup Go 1.22 Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: 🔨 1.3 Compile Go Backend (Validation)
        run: |
          echo "========================================================"
          echo "🚀 Compiling SHC Go Binaries (Router & Distributed Nodes)"
          echo "========================================================"
          cd backend
          go mod tidy
          go build -v ./cmd/router
          go build -v ./cmd/node
          echo "✅ Go backend binaries compiled successfully with exit code 0"

      - name: 📦 1.4 Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: 💻 1.5 Build Next.js 16 Production Dashboard (Validation)
        run: |
          echo "========================================================"
          echo "🚀 Building Next.js Dashboard & Documentation Portal"
          echo "========================================================"
          cd dashboard
          npm install
          npm run build
          echo "✅ Next.js production build completed successfully"

      - name: 🐳 1.6 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 1.7 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 1.8 Build & Push Ultra-Fast Docker Images to GHCR
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Building & pushing to ghcr.io/${REPO_LOWER}..."
          docker build -t "ghcr.io/${REPO_LOWER}/backend:latest" ./backend
          docker build -t "ghcr.io/${REPO_LOWER}/dashboard:latest" ./dashboard
          docker push "ghcr.io/${REPO_LOWER}/backend:latest"
          docker push "ghcr.io/${REPO_LOWER}/dashboard:latest"
          echo "✅ Pre-built images published to GHCR!"

      - name: 📊 1.9 Generate CI Build Summary
        if: always()
        run: |
          echo "### 🔍 CI Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Backend** | ✅ Compiled & Published | \`ghcr.io/${{ github.repository }}/backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Next.js Dashboard** | ✅ Built & Published | \`ghcr.io/${{ github.repository }}/dashboard:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` | \`${{ github.ref_name }}\` by @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # STAGE 2: Continuous Deployment (Zero-Downtime Instant Pull & Rollout)
  # =========================================================================
  deploy:
    name: "🚀 Phase 2: Deploy to AWS Cluster"
    needs: ci
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: 📡 2.1 Deploy to EC2-A (Gateway Router + Nodes A, D, G)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_A_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            echo "========================================================"
            echo "⚡ [EC2-A: 10.0.1.10] Instant Pull & Restart Containers"
            echo "========================================================"
            if [ -d /app/shc ]; then cd /app/shc; elif [ -d "$HOME/shc" ]; then cd "$HOME/shc"; elif [ -d /home/ubuntu/shc ]; then cd /home/ubuntu/shc; elif [ -d /home/ec2-user/shc ]; then cd /home/ec2-user/shc; fi
            git pull origin main
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f deploy/ec2-a.docker-compose.yml pull || true
              docker compose -f deploy/gateway.docker-compose.yml pull || true
              docker compose -f deploy/ec2-a.docker-compose.yml up -d --force-recreate
              docker compose -f deploy/gateway.docker-compose.yml up -d --force-recreate
            else
              docker-compose -f deploy/ec2-a.docker-compose.yml pull || true
              docker-compose -f deploy/gateway.docker-compose.yml pull || true
              docker-compose -f deploy/ec2-a.docker-compose.yml up -d --force-recreate
              docker-compose -f deploy/gateway.docker-compose.yml up -d --force-recreate
            fi
            echo "✅ [EC2-A] Gateway Router (:8000), Dashboard (:3000), and Nodes A, D, G are LIVE!"

      - name: 🔄 2.2 Deploy to EC2-B (10.0.1.11) via Bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 10.0.1.11
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_A_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            echo "========================================================"
            echo "⚡ [EC2-B: 10.0.1.11] Updating Cross-Host Nodes B, E, H"
            echo "========================================================"
            if [ ! -d "/app/shc/.git" ] && [ ! -d "$HOME/shc/.git" ] && [ ! -d "/home/ubuntu/shc/.git" ]; then
              mkdir -p "$HOME/shc" && git clone https://github.com/rushist/SHC.git "$HOME/shc" || true
            fi
            if [ -d /app/shc ]; then cd /app/shc; elif [ -d "$HOME/shc" ]; then cd "$HOME/shc"; elif [ -d /home/ubuntu/shc ]; then cd /home/ubuntu/shc; fi
            git pull origin main || true
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f deploy/ec2-b.docker-compose.yml pull || true
              docker compose -f deploy/ec2-b.docker-compose.yml up -d --force-recreate
            else
              docker-compose -f deploy/ec2-b.docker-compose.yml pull || true
              docker-compose -f deploy/ec2-b.docker-compose.yml up -d --force-recreate
            fi
            echo "✅ [EC2-B] Nodes B, E, H are LIVE!"

      - name: 🔄 2.3 Deploy to EC2-C (10.0.1.13) via Bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 10.0.1.13
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_A_HOST }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 15m
          script: |
            echo "========================================================"
            echo "⚡ [EC2-C: 10.0.1.13] Updating Cross-Host Nodes C, F, I"
            echo "========================================================"
            if [ ! -d "/app/shc/.git" ] && [ ! -d "$HOME/shc/.git" ] && [ ! -d "/home/ubuntu/shc/.git" ]; then
              mkdir -p "$HOME/shc" && git clone https://github.com/rushist/SHC.git "$HOME/shc" || true
            fi
            if [ -d /app/shc ]; then cd /app/shc; elif [ -d "$HOME/shc" ]; then cd "$HOME/shc"; elif [ -d /home/ubuntu/shc ]; then cd /home/ubuntu/shc; fi
            git pull origin main || true
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            export DOCKER_REGISTRY="ghcr.io/${REPO_LOWER}"
            if docker compose version >/dev/null 2>&1; then
              docker compose -f deploy/ec2-c.docker-compose.yml pull || true
              docker compose -f deploy/ec2-c.docker-compose.yml up -d --force-recreate
            else
              docker-compose -f deploy/ec2-c.docker-compose.yml pull || true
              docker-compose -f deploy/ec2-c.docker-compose.yml up -d --force-recreate
            fi
            echo "✅ [EC2-C] Nodes C, F, I are LIVE!"

      - name: 🌐 2.3 Publish Deployment Summary
        if: always()
        run: |
          echo "## 🚀 AWS Multi-Machine Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Machine | Private IP | Failure Domain | Roles & Ports | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-A** | \`10.0.1.10\` | \`ap-south-1a\` | Gateway (:8000), Dashboard (:3000), Nodes A, D, G | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-B** | \`10.0.1.11\` | \`ap-south-1a\` | Nodes B, E, H (:8001-:8003) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| **EC2-C** | \`10.0.1.13\` | \`ap-south-1b\` | Nodes C, F, I (:8001-:8003) | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Live Dashboard**: [http://${{ secrets.EC2_A_HOST }}:3000](http://${{ secrets.EC2_A_HOST }}:3000)" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Gateway API**: [http://${{ secrets.EC2_A_HOST }}:8000](http://${{ secrets.EC2_A_HOST }}:8000)" >> $GITHUB_STEP_SUMMARY
